<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>器材借還系統 V3.3</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      background: #f3f4f6;
      margin: 0;
      color: #111827;
    }

    .app {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px;
    }

    .hero {
      background: linear-gradient(135deg, #111827, #374151);
      color: white;
      border-radius: 22px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(17, 24, 39, 0.25);
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .hero p {
      margin: 0;
      color: #d1d5db;
      font-size: 14px;
      line-height: 1.6;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat, .card {
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.07);
    }

    .stat {
      padding: 14px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 24px;
      margin-bottom: 4px;
    }

    .stat span {
      color: #6b7280;
      font-size: 13px;
    }

    .card {
      padding: 16px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    input, select, button {
      width: 100%;
      max-width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      font-size: 16px;
      font-family: inherit;
      min-width: 0;
    }

    label {
      display: block;
      margin-top: 10px;
      color: #374151;
      font-weight: 700;
      font-size: 14px;
    }

    button {
      background: #111827;
      color: white;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-blue { background: #2563eb; }
    .btn-green { background: #16a34a; }
    .btn-red { background: #b91c1c; }
    .btn-gray { background: #6b7280; }
    .btn-orange { background: #ea580c; }

    .mode-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .mode-buttons button { margin-top: 0; }

    .mode-buttons button.inactive {
      background: #e5e7eb;
      color: #374151;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      align-items: start;
    }

    .item, .record, .admin-row {
      padding: 14px 0;
      border-bottom: 1px solid #e5e7eb;
      line-height: 1.7;
    }

    .item:last-child, .record:last-child, .admin-row:last-child {
      border-bottom: none;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .available { background: #dcfce7; color: #166534; }
    .borrowed { background: #fee2e2; color: #991b1b; }
    .overdue { background: #fef3c7; color: #92400e; }
    .role-super { background: #ede9fe; color: #5b21b6; }
    .role-admin { background: #dbeafe; color: #1d4ed8; }
    .inactive-badge { background: #e5e7eb; color: #4b5563; }

    .small {
      color: #6b7280;
      font-size: 14px;
    }

    .empty {
      color: #9ca3af;
      text-align: center;
      padding: 22px;
    }

    .section-note {
      color: #6b7280;
      font-size: 14px;
      margin-top: -4px;
      margin-bottom: 10px;
      line-height: 1.6;
    }

    .edit-box {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 12px;
      margin-top: 10px;
    }

    .public-mode, .admin-mode-hidden, .hidden {
      display: none !important;
    }

    .public-note, .login-note {
      background: #eef2ff;
      color: #3730a3;
      border-radius: 14px;
      padding: 12px;
      font-size: 14px;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .loading {
      background: #fff7ed;
      color: #9a3412;
      border-radius: 14px;
      padding: 12px;
      font-size: 14px;
      margin-bottom: 12px;
      display: none;
    }

    .user-bar {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      background: white;
      border-radius: 18px;
      padding: 12px 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.07);
    }

    .user-bar button {
      width: auto;
      margin-top: 0;
      padding: 9px 14px;
    }

    .option-manager-block {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 12px;
      margin-top: 12px;
    }

    .option-manager-block h3 {
      margin: 0 0 6px;
      font-size: 16px;
    }

    @media (max-width: 560px) {
      .app { padding: 12px; }
      .hero h1 { font-size: 24px; }
      .stat { padding: 10px; }
      .stat strong { font-size: 20px; }
      .grid-2, .grid-3, .mode-buttons { grid-template-columns: 1fr; }
      input, select, button { font-size: 16px; }
      .user-bar { align-items: stretch; }
      .user-bar button { width: 100%; margin-top: 10px; }
    }
  </style>
</head>

<body>
  <div class="app">

    <section class="hero">
      <h1 id="pageTitle">📦 器材借還系統</h1>
      <p id="pageSubtitle">V3.3 多管理員版：Enter 登入、選單資料管理。</p>
    </section>

    <div id="loadingBox" class="loading">資料處理中，請稍候...</div>

    <section id="loginCard" class="card admin-login-only">
      <h2>管理員登入</h2>
      <div class="login-note">請使用管理員帳號密碼登入。借還入口不需要登入。</div>
      <input type="text" id="loginUsername" placeholder="帳號" autocomplete="username">
      <input type="password" id="loginPassword" placeholder="密碼" autocomplete="current-password">
      <button onclick="loginAdmin()">登入</button>
    </section>

    <div id="userBar" class="user-bar admin-auth-only hidden">
      <div>
        <strong id="currentUserName">管理員</strong>
        <div class="small" id="currentUserRole">role</div>
      </div>
      <button class="btn-gray" onclick="logoutAdmin()">登出</button>
    </div>

    <section class="stats admin-only admin-auth-only hidden">
      <div class="stat">
        <strong id="totalCount">0</strong>
        <span>總器材</span>
      </div>
      <div class="stat">
        <strong id="availableCount">0</strong>
        <span>可借用</span>
      </div>
      <div class="stat">
        <strong id="borrowedCount">0</strong>
        <span>借用中</span>
      </div>
    </section>

    <section class="card public-only">
      <h2>借還入口</h2>
      <p class="section-note">QRCode 掃進來後會看到這個區塊。</p>

      <div id="publicNote" class="public-note" style="display:none;">
        請選擇借用或歸還器材，送出後會同步到管理員後台。
      </div>

      <div class="mode-buttons">
        <button id="borrowModeBtn" onclick="setMode('borrow')">我要借器材</button>
        <button id="returnModeBtn" class="inactive" onclick="setMode('return')">我要還器材</button>
      </div>

      <div id="borrowPanel">
        <input type="text" id="borrowerName" placeholder="借用人姓名">
        <select id="borrowItemSelect"></select>

        <label for="expectedReturnDate">預計歸還日期</label>
        <div class="grid-2">
          <input type="date" id="expectedReturnDate">
          <input type="text" id="borrowPurpose" placeholder="用途，例如：會議使用">
        </div>

        <button onclick="borrowItem()">確認借用</button>
      </div>

      <div id="returnPanel" style="display:none;">
        <select id="returnRecordSelect"></select>
        <button class="btn-blue" onclick="returnSelectedItem()">確認歸還</button>
      </div>
    </section>

    <section class="card admin-only admin-auth-only hidden">
      <h2>目前借用中</h2>
      <div id="borrowedList"></div>
    </section>

    <section class="card admin-only admin-auth-only hidden">
      <h2>新增器材</h2>
      <div class="grid-2">
        <input type="text" id="itemName" placeholder="器材名稱，例如：投影機 A01">

        <div>
          <select id="itemCategorySelect" onchange="handleCategorySelectChange()"></select>
          <input type="text" id="itemCategoryNew" placeholder="輸入新分類，例如：資訊設備" style="display:none;">
        </div>
      </div>

      <div class="grid-2">
        <div>
          <select id="custodianUnitSelect" onchange="handleCustodianUnitSelectChange()"></select>
          <input type="text" id="custodianUnitNew" placeholder="輸入新保管單位，例如：資訊室" style="display:none;">
        </div>

        <div>
          <select id="custodianNameSelect" onchange="handleCustodianNameSelectChange()"></select>
          <input type="text" id="custodianNameNew" placeholder="輸入新保管人，例如：王小明" style="display:none;">
        </div>
      </div>

      <button onclick="addItem()">新增器材</button>
    </section>

    <section class="card admin-only admin-auth-only hidden">
      <h2>器材列表</h2>
      <input type="text" id="searchInput" placeholder="搜尋器材名稱、分類、保管單位、保管人" oninput="renderItems()">
      <div id="itemList"></div>
    </section>

    <section class="card admin-only admin-auth-only hidden">
      <h2>歷史紀錄</h2>
      <div id="historyList"></div>
    </section>

    <section id="adminManageCard" class="card admin-only admin-auth-only superadmin-only hidden">
      <h2>管理員管理</h2>
      <p class="section-note">只有總管理人可以新增、啟用或停用一般管理員。</p>

      <div class="grid-2">
        <input type="text" id="newAdminUsername" placeholder="新管理員帳號">
        <input type="password" id="newAdminPassword" placeholder="新管理員密碼">
      </div>
      <div class="grid-2">
        <input type="text" id="newAdminDisplayName" placeholder="顯示名稱，例如：王小明">
        <select id="newAdminRole">
          <option value="admin">一般管理員</option>
          <option value="superadmin">總管理人</option>
        </select>
      </div>
      <button onclick="addAdminUser()">新增管理員</button>

      <div id="adminList"></div>
    </section>

    <section id="optionManageCard" class="card admin-only admin-auth-only superadmin-only hidden">
      <h2>資料選單管理</h2>
      <p class="section-note">只有總管理人可以修改。改名後會套用到所有器材資料。</p>

      <div class="option-manager-block">
        <h3>分類管理</h3>
        <select id="manageCategorySelect"></select>
        <input type="text" id="manageCategoryNewName" placeholder="輸入新的分類名稱">
        <button class="btn-orange" onclick="renameOptionValue('category')">修改分類名稱</button>
      </div>

      <div class="option-manager-block">
        <h3>保管單位管理</h3>
        <select id="manageCustodianUnitSelect"></select>
        <input type="text" id="manageCustodianUnitNewName" placeholder="輸入新的保管單位">
        <button class="btn-orange" onclick="renameOptionValue('custodianUnit')">修改保管單位</button>
      </div>

      <div class="option-manager-block">
        <h3>保管人管理</h3>
        <select id="manageCustodianNameSelect"></select>
        <input type="text" id="manageCustodianNameNewName" placeholder="輸入新的保管人姓名">
        <button class="btn-orange" onclick="renameOptionValue('custodianName')">修改保管人</button>
      </div>
    </section>


    <section class="card admin-only admin-auth-only hidden">
      <h2>管理工具</h2>
      <button class="btn-gray" onclick="copyPublicUrl()">複製借還入口網址</button>
      <button class="btn-gray" onclick="loadData()">重新整理資料</button>
    </section>

  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzWCXI7WV2qGY4XuXZs7xb2u1gu_QW4YwtWvlMWH4469X-NeRX_17HMXPtOLv5vrjyX/exec";
    const SESSION_KEY = "equipment_admin_user_v3";

    const urlParams = new URLSearchParams(window.location.search);
    const pageMode = urlParams.get("mode") === "public" ? "public" : "admin";

    let items = [];
    let records = [];
    let admins = [];
    let currentMode = "borrow";
    let editingItemId = null;
    let currentUser = null;

    const ADD_NEW_CATEGORY_VALUE = "__ADD_NEW_CATEGORY__";

    function initPageMode() {
      if (pageMode === "public") {
        document.getElementById("pageTitle").textContent = "📦 器材借還入口";
        document.getElementById("pageSubtitle").textContent = "請選擇借用或歸還器材。";
        document.getElementById("publicNote").style.display = "block";

        document.querySelectorAll(".admin-only, .admin-login-only").forEach(el => {
          el.classList.add("public-mode");
        });
      } else {
        document.querySelectorAll(".public-only").forEach(el => {
          el.classList.add("admin-mode-hidden");
        });
      }
    }

    function setLoading(isLoading) {
      document.getElementById("loadingBox").style.display = isLoading ? "block" : "none";
      document.querySelectorAll("button").forEach(btn => btn.disabled = isLoading);
    }

    async function apiGetData() {
      const res = await fetch(`${API_URL}?action=getData`);
      return await res.json();
    }

    async function apiPost(action, payload = {}) {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action, ...payload })
      });
      return await res.json();
    }

    function authPayload() {
      return {
        currentUsername: currentUser?.username || "",
        currentRole: currentUser?.role || ""
      };
    }

    function isSuperAdmin() {
      return currentUser && currentUser.role === "superadmin";
    }

    function canManageItem(item) {
      if (!currentUser) return false;
      if (isSuperAdmin()) return true;
      return String(item.ownerUsername || "") === String(currentUser.username || "");
    }

    async function loginAdmin() {
      const username = document.getElementById("loginUsername").value.trim();
      const password = document.getElementById("loginPassword").value.trim();

      if (!username || !password) return alert("請輸入帳號與密碼");

      try {
        setLoading(true);
        const data = await apiPost("login", { username, password });

        if (!data.ok) return alert(data.error || "登入失敗");

        currentUser = data.user;
        sessionStorage.setItem(SESSION_KEY, JSON.stringify(currentUser));

        const payload = data.data || {};
        items = normalizeItems(payload.items || []);
        records = normalizeRecords(payload.records || []);

        showAdminUI();
        renderAll();

        if (isSuperAdmin()) await loadAdmins();
      } catch (err) {
        alert("登入失敗：" + err.message);
      } finally {
        setLoading(false);
      }
    }

    function setupLoginEnterKey() {
      if (pageMode === "public") return;

      ["loginUsername", "loginPassword"].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;

        el.addEventListener("keydown", event => {
          if (event.key === "Enter") {
            event.preventDefault();
            loginAdmin();
          }
        });
      });
    }


    function restoreLoginSession() {
      if (pageMode === "public") return false;

      const raw = sessionStorage.getItem(SESSION_KEY);
      if (!raw) return false;

      try {
        currentUser = JSON.parse(raw);
        if (!currentUser?.username || !currentUser?.role) return false;
        showAdminUI();
        return true;
      } catch {
        sessionStorage.removeItem(SESSION_KEY);
        return false;
      }
    }

    function showAdminUI() {
      document.getElementById("loginCard").classList.add("hidden");
      document.querySelectorAll(".admin-auth-only").forEach(el => el.classList.remove("hidden"));

      document.getElementById("currentUserName").textContent = currentUser.displayName || currentUser.username;
      document.getElementById("currentUserRole").textContent = currentUser.role === "superadmin" ? "總管理人" : "一般管理員";

      document.querySelectorAll(".superadmin-only").forEach(el => {
        el.classList.toggle("hidden", !isSuperAdmin());
      });
    }

    function logoutAdmin() {
      sessionStorage.removeItem(SESSION_KEY);
      location.reload();
    }

    async function loadData() {
      try {
        setLoading(true);
        const data = await apiGetData();

        if (!data.ok) {
          alert(data.error || "讀取資料失敗");
          return;
        }

        items = normalizeItems(data.items || []);
        records = normalizeRecords(data.records || []);
        renderAll();

        if (pageMode === "admin" && isSuperAdmin()) await loadAdmins();
      } catch (err) {
        alert("讀取資料失敗：" + err.message);
      } finally {
        setLoading(false);
      }
    }

    async function loadAdmins() {
      if (!isSuperAdmin()) return;

      try {
        const data = await apiPost("getAdmins", authPayload());
        if (!data.ok) return alert(data.error || "讀取管理員清單失敗");

        admins = normalizeAdmins(data.admins || []);
        renderAdminList();
      } catch (err) {
        alert("讀取管理員清單失敗：" + err.message);
      }
    }

    function normalizeItems(list) {
      return list.map(item => ({
        id: String(item.id),
        name: item.name || "",
        category: item.category || "未分類",
        custodianUnit: item.custodianUnit || "",
        custodianName: item.custodianName || "",
        ownerUsername: item.ownerUsername || "",
        available: String(item.available).toUpperCase() === "TRUE"
      }));
    }

    function normalizeRecords(list) {
      return list.map(record => {
        const borrowTime = pickField(record, ["borrowTime", "borrow time", "借出", "借出時間"]);
        const returnTime = pickField(record, ["returnTime", "return time", "實際歸還", "歸還時間"]);
        const expectedReturnDate = pickField(record, ["expectedReturnDate", "expected return date", "預計歸還"]);

        return {
          id: String(pickField(record, ["id"]) || ""),
          itemId: String(pickField(record, ["itemId", "item id"]) || ""),
          itemName: pickField(record, ["itemName", "item name", "器材名稱"]) || "",
          itemCategory: pickField(record, ["itemCategory", "item category", "分類"]) || "未分類",
          borrower: pickField(record, ["borrower", "借用人"]) || "",
          borrowTime: displayDateTime(borrowTime),
          expectedReturnDate: displayDate(expectedReturnDate),
          purpose: pickField(record, ["purpose", "用途"]) || "",
          returnTime: displayDateTime(returnTime),
          status: pickField(record, ["status", "狀態"]) || ""
        };
      });
    }

    function normalizeAdmins(list) {
      return list.map(admin => ({
        id: String(admin.id),
        username: admin.username || "",
        displayName: admin.displayName || admin.username || "",
        role: admin.role || "admin",
        active: String(admin.active).toUpperCase() === "TRUE",
        createdAt: displayDateTime(admin.createdAt)
      }));
    }
    function pickField(obj, candidateKeys) {
      if (!obj) return "";

      for (const key of candidateKeys) {
        if (obj[key] !== undefined && obj[key] !== null && obj[key] !== "") {
          return obj[key];
        }
      }

      const normalizeKey = key => String(key)
        .replace(/[\s_\-｜|:：]/g, "")
        .toLowerCase();

      const normalizedMap = Object.keys(obj).reduce((map, key) => {
        map[normalizeKey(key)] = obj[key];
        return map;
      }, {});

      for (const key of candidateKeys) {
        const normalized = normalizeKey(key);
        if (normalizedMap[normalized] !== undefined && normalizedMap[normalized] !== null && normalizedMap[normalized] !== "") {
          return normalizedMap[normalized];
        }
      }

      return "";
    }


    function displayDateTime(value) {
      if (!value) return "";
      const text = String(value);
      if (/^\d{4}\/\d{2}\/\d{2}\s\d{2}:\d{2}/.test(text)) return text;
      if (/^\d{4}-\d{2}-\d{2}T/.test(text)) {
        const d = new Date(text);
        if (!isNaN(d.getTime())) {
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, "0");
          const day = String(d.getDate()).padStart(2, "0");
          const hh = String(d.getHours()).padStart(2, "0");
          const mm = String(d.getMinutes()).padStart(2, "0");
          return `${y}/${m}/${day} ${hh}:${mm}`;
        }
      }
      return text;
    }

    function displayDate(value) {
      if (!value) return "";
      const text = String(value);
      if (/^\d{4}\/\d{2}\/\d{2}$/.test(text)) return text;
      if (/^\d{4}-\d{2}-\d{2}T/.test(text)) {
        const d = new Date(text);
        if (!isNaN(d.getTime())) {
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, "0");
          const day = String(d.getDate()).padStart(2, "0");
          return `${y}/${m}/${day}`;
        }
      }
      return text;
    }

    function getCategories() {
      const baseCategories = ["未分類"];
      const existingCategories = items.map(item => item.category || "未分類").filter(Boolean);
      return [...new Set([...baseCategories, ...existingCategories])];
    }

    function getCustodianUnits() {
      const baseUnits = ["未填"];
      const existingUnits = items.map(item => item.custodianUnit || "").filter(Boolean);
      return [...new Set([...baseUnits, ...existingUnits])];
    }

    function getCustodianNames() {
      const baseNames = ["未填"];
      const existingNames = items.map(item => item.custodianName || "").filter(Boolean);
      return [...new Set([...baseNames, ...existingNames])];
    }

    function renderCategorySelects() {
      renderAddCategorySelect();
      renderAddCustodianUnitSelect();
      renderAddCustodianNameSelect();
      renderVisibleEditCategorySelects();

    function isOverdue(dateStr) {
      if (!dateStr) return false;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const target = new Date(dateStr.replaceAll("/", "-"));
      target.setHours(0, 0, 0, 0);
      return !isNaN(target.getTime()) && target < today;
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById("borrowPanel").style.display = mode === "borrow" ? "block" : "none";
      document.getElementById("returnPanel").style.display = mode === "return" ? "block" : "none";
      document.getElementById("borrowModeBtn").classList.toggle("inactive", mode !== "borrow");
      document.getElementById("returnModeBtn").classList.toggle("inactive", mode !== "return");
      renderBorrowSelect();
      renderReturnSelect();
    }

    async function addItem() {
      const nameInput = document.getElementById("itemName");
      const name = nameInput.value.trim();
      const category = getAddCategoryValue();
      const custodianUnit = getAddCustodianUnitValue();
      const custodianName = getAddCustodianNameValue();

      if (!name) return alert("請輸入器材名稱");

      try {
        setLoading(true);
        const data = await apiPost("addItem", { ...authPayload(), name, category, custodianUnit, custodianName });
        if (!data.ok) return alert(data.error || "新增失敗");

        items = normalizeItems(data.items || []);
        records = normalizeRecords(data.records || []);

        nameInput.value = "";
        document.getElementById("itemCategoryNew").value = "";
        document.getElementById("itemCategoryNew").style.display = "none";
        document.getElementById("custodianUnitNew").value = "";
        document.getElementById("custodianUnitNew").style.display = "none";
        document.getElementById("custodianNameNew").value = "";
        document.getElementById("custodianNameNew").style.display = "none";

        renderAll();
      } catch (err) {
        alert("新增失敗：" + err.message);
      } finally {
        setLoading(false);
      }
    }

    async function renameOptionValue(type) {
      if (!isSuperAdmin()) return alert("只有總管理人可以修改選單資料");

      const config = {
        category: {
          label: "分類",
          selectId: "manageCategorySelect",
          inputId: "manageCategoryNewName",
          field: "category",
          emptyValue: "未分類"
        },
        custodianUnit: {
          label: "保管單位",
          selectId: "manageCustodianUnitSelect",
          inputId: "manageCustodianUnitNewName",
          field: "custodianUnit",
          emptyValue: ""
        },
        custodianName: {
          label: "保管人",
          selectId: "manageCustodianNameSelect",
          inputId: "manageCustodianNameNewName",
          field: "custodianName",
          emptyValue: ""
        }
      }[type];

      if (!config) return;

      const select = document.getElementById(config.selectId);
      const input = document.getElementById(config.inputId);

      const oldValue = (select.value || "").trim();
      const newValue = (input.value || "").trim();

      if (!oldValue) return alert(`請先選擇要修改的${config.label}`);
      if (!newValue) return alert(`請輸入新的${config.label}名稱`);
      if (oldValue === newValue) return alert("新舊名稱相同，不需要修改");

      const duplicate = items.some(item => String(item[config.field] || "").trim() === newValue);
      if (duplicate) {
        const okDuplicate = confirm(`「${newValue}」已經存在，仍要把「${oldValue}」合併成「${newValue}」嗎？`);
        if (!okDuplicate) return;
      }

      const targetItems = items.filter(item => String(item[config.field] || "").trim() === oldValue);

      if (!targetItems.length) {
        alert(`找不到使用「${oldValue}」的器材`);
        return;
      }

      const ok = confirm(`確定要把 ${targetItems.length} 筆器材的${config.label}「${oldValue}」改成「${newValue}」嗎？`);
      if (!ok) return;

      try {
        setLoading(true);

        let latestData = null;

        for (const item of targetItems) {
          const payload = {
            ...authPayload(),
            id: String(item.id),
            name: item.name,
            category: type === "category" ? newValue : item.category,
            custodianUnit: type === "custodianUnit" ? newValue : item.custodianUnit,
            custodianName: type === "custodianName" ? newValue : item.custodianName
          };

          latestData = await apiPost("updateItem", payload);

          if (!latestData.ok) {
            throw new Error(latestData.error || `修改${config.label}失敗`);
          }
        }

        items = normalizeItems(latestData.items || []);
        records = normalizeRecords(latestData.records || []);

        input.value = "";
        renderAll();
        alert(`${config.label}已修改完成`);
      } catch (err) {
        alert("修改失敗：" + err.message);
      } finally {
        setLoading(false);
      }
    }

    function renderItems() {
      if (pageMode === "public") return;

      const list = document.getElementById("itemList");
      const keyword = document.getElementById("searchInput").value.trim().toLowerCase();

      let filtered = items;
      if (keyword) {
        filtered = items.filter(item =>
          item.name.toLowerCase().includes(keyword) ||
          item.category.toLowerCase().includes(keyword) ||
          item.custodianUnit.toLowerCase().includes(keyword) ||
          item.custodianName.toLowerCase().includes(keyword)
        );
      }

      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty">找不到符合的器材</div>`;
        return;
      }

      list.innerHTML = filtered.map(item => {
        if (editingItemId === item.id) {
          return `
            <div class="item">
              <div class="edit-box">
                <strong>編輯器材</strong>

                <input id="editName-${escapeHtml(item.id)}" type="text" value="${escapeHtml(item.name)}">

                <select id="editCategorySelect-${escapeHtml(item.id)}" onchange="handleEditCategorySelectChange('${escapeJs(item.id)}')"></select>
                <input id="editCategoryNew-${escapeHtml(item.id)}" type="text" placeholder="輸入新分類，例如：資訊設備" style="display:none;">

                <div class="grid-2">
                  <div>
                    <select id="editCustodianUnitSelect-${escapeHtml(item.id)}" onchange="handleEditCustodianSelectChange('${escapeJs(item.id)}', 'unit')"></select>
                    <input id="editCustodianUnitNew-${escapeHtml(item.id)}" type="text" placeholder="輸入新保管單位，例如：資訊室" style="display:none;">
                  </div>

                  <div>
                    <select id="editCustodianNameSelect-${escapeHtml(item.id)}" onchange="handleEditCustodianSelectChange('${escapeJs(item.id)}', 'name')"></select>
                    <input id="editCustodianNameNew-${escapeHtml(item.id)}" type="text" placeholder="輸入新保管人，例如：王小明" style="display:none;">
                  </div>
                </div>

                <div class="grid-2">
                  <button class="btn-green" onclick="saveEditItem('${escapeJs(item.id)}')">儲存</button>
                  <button class="btn-gray" onclick="cancelEditItem()">取消</button>
                </div>
              </div>
            </div>
          `;
        }

        const canEdit = canManageItem(item);

        return `
          <div class="item">
            <div class="title-row">
              <strong>${escapeHtml(item.name)}</strong>
              <span class="badge ${item.available ? "available" : "borrowed"}">${item.available ? "可借用" : "借用中"}</span>
            </div>

            <div class="small">分類：${escapeHtml(item.category)}</div>
            <div class="small">保管單位：${escapeHtml(item.custodianUnit || "未填")}</div>
            <div class="small">保管人：${escapeHtml(item.custodianName || "未填")}</div>
            <div class="small">建立者：${escapeHtml(item.ownerUsername || "未記錄")}</div>

            <div class="grid-2">
              ${canEdit ? `<button class="btn-orange" onclick="startEditItem('${escapeJs(item.id)}')">編輯</button>` : `<button class="btn-gray" disabled>不可編輯</button>`}
              ${item.available && canEdit ? `<button class="btn-red" onclick="deleteItem('${escapeJs(item.id)}')">刪除</button>` : `<button class="btn-gray" disabled>${item.available ? "不可刪除" : "借用中不可刪除"}</button>`}
            </div>
          </div>
        `;
      }).join("");
    }

    function renderBorrowedList() {
      if (pageMode === "public") return;

      const list = document.getElementById("borrowedList");
      const borrowedRecords = records.filter(r => r.status === "borrowed");

      if (borrowedRecords.length === 0) {
        list.innerHTML = `<div class="empty">目前沒有器材借用中</div>`;
        return;
      }

      list.innerHTML = borrowedRecords.map(record => {
        const overdue = isOverdue(record.expectedReturnDate);
        return `
          <div class="record">
            <div class="title-row">
              <strong>${escapeHtml(record.itemName)}</strong>
              <span class="badge ${overdue ? "overdue" : "borrowed"}">${overdue ? "逾期" : "借用中"}</span>
            </div>

            <div>借用人：${escapeHtml(record.borrower)}</div>
            <div>分類：${escapeHtml(record.itemCategory)}</div>
            <div>借出時間：${record.borrowTime || "未記錄"}</div>
            <div>預計歸還：${record.expectedReturnDate || "未填"}</div>
            <div>用途：${escapeHtml(record.purpose || "未填")}</div>

            <button class="btn-blue" onclick="returnItem('${escapeJs(record.id)}')">歸還</button>
          </div>
        `;
      }).join("");
    }

    function renderHistory() {
      if (pageMode === "public") return;

      const list = document.getElementById("historyList");
      if (records.length === 0) {
        list.innerHTML = `<div class="empty">尚無借還紀錄</div>`;
        return;
      }

      const recentRecords = [...records].reverse();
      list.innerHTML = recentRecords.map(record => `
        <div class="record">
          <div class="title-row">
            <strong>${escapeHtml(record.itemName)}</strong>
            <span class="badge ${record.status === "borrowed" ? "borrowed" : "available"}">${record.status === "borrowed" ? "借用中" : "已歸還"}</span>
          </div>

          <div>借用人：${escapeHtml(record.borrower)}</div>
          <div>分類：${escapeHtml(record.itemCategory)}</div>
          <div>借出：${record.borrowTime || "未記錄"}</div>
          <div>實際歸還：${record.returnTime || "尚未歸還"}</div>
          <div>用途：${escapeHtml(record.purpose || "未填")}</div>
        </div>
      `).join("");
    }

    function renderAdminList() {
      if (!isSuperAdmin()) return;
      const list = document.getElementById("adminList");

      if (admins.length === 0) {
        list.innerHTML = `<div class="empty">尚無管理員資料</div>`;
        return;
      }

      list.innerHTML = admins.map(admin => `
        <div class="admin-row">
          <div class="title-row">
            <strong>${escapeHtml(admin.displayName)}（${escapeHtml(admin.username)}）</strong>
            <span class="badge ${admin.active ? "available" : "inactive-badge"}">${admin.active ? "啟用中" : "已停用"}</span>
          </div>
          <div class="small">權限：<span class="badge ${admin.role === "superadmin" ? "role-super" : "role-admin"}">${admin.role === "superadmin" ? "總管理人" : "一般管理員"}</span></div>
          <div class="small">建立時間：${admin.createdAt || "未記錄"}</div>
          ${admin.username === currentUser.username ? `
            <button class="btn-gray" disabled>目前登入帳號</button>
          ` : `
            <button class="${admin.active ? "btn-red" : "btn-green"}" onclick="toggleAdminUser('${escapeJs(admin.username)}')">${admin.active ? "停用" : "啟用"}</button>
          `}
        </div>
      `).join("");
    }

    function copyPublicUrl() {
      const baseUrl = window.location.href.split("?")[0];
      const publicUrl = `${baseUrl}?mode=public`;
      navigator.clipboard.writeText(publicUrl)
        .then(() => alert("已複製借還入口網址"))
        .catch(() => prompt("請手動複製這個網址：", publicUrl));
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeJs(text) {
      return String(text)
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'")
        .replaceAll('"', '\\"')
        .replaceAll("\n", "\\n")
        .replaceAll("\r", "\\r");
    }

    function renderAll() {
      renderStats();
      renderCategorySelects();
      renderBorrowSelect();
      renderReturnSelect();
      renderItems();
      renderBorrowedList();
      renderHistory();
      renderAdminList();
      renderOptionManager();
    }

    initPageMode();
    setupLoginEnterKey();
    setMode("borrow");

    if (pageMode === "public") {
      loadData();
    } else {
      if (restoreLoginSession()) {
        loadData();
      }
    }
  </script>
</body>
</html>
